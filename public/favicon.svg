<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Obsidian Canvas -->
  <rect width="64" height="64" rx="16" fill="#07090e"/>
  <!-- Precision hairline border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="2"/>
  <!-- Monogram Logo -->
  <text x="32" y="43" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'Courier New', monospace" font-size="27" font-weight="900" fill="url(#emerald-cyan)" letter-spacing="-1">MH</text>
  <!-- Telemetry Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#10b981"/>
</svg>
